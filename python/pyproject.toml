[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaano"
version = "1.3.0"
description = "Official Jaano Enterprise Developer API v1 SDK for Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://github.com/janoo-ai/jaano-sdks/tree/main/python"
Repository = "https://github.com/janoo-ai/jaano-sdks"
Issues = "https://github.com/janoo-ai/jaano-sdks/issues"
Changelog = "https://github.com/janoo-ai/jaano-sdks/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["jaano*"]

[tool.setuptools.package-data]
jaano = ["py.typed"]
